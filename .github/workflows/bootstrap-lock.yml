name: Bootstrap dependency lock once
on:
  push:
    branches: [feat/stage-1-foundation]
    paths: [.github/workflows/bootstrap-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/stage-1-foundation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve patched stable release lines and pin exact versions
        run: |
          npm install --ignore-scripts --save-exact next@16 react@19 react-dom@19 @supabase/supabase-js@2 @supabase/ssr@0
          npm install --ignore-scripts --save-dev --save-exact eslint-config-next@16 eslint@9
          npm audit --omit=dev
          cat package.json
      - name: Commit dependency manifest and lock to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Pin current patched dependencies and commit npm lockfile'
          git push origin HEAD:feat/stage-1-foundation
