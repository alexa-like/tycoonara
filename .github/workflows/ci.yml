name: Stage 1 checks
on:
  push:
    branches: [main, feat/stage-1-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install exact dependencies
        run: npm install --ignore-scripts
      - name: Ensure lockfile is committed
        run: |
          if [ ! -f package-lock.json ]; then exit 1; fi
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git diff --exit-code -- package-lock.json
          else
            echo '::warning::Initial dependency lock generated; download dependency-lock artifact and commit before merging.'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-lock
          path: package-lock.json
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Start isolated local Supabase
        run: npx supabase@2.75.0 start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations to local database
        run: npx supabase@2.75.0 db reset --local --no-seed
      - name: Configure local-only public auth variables
        run: |
          npx supabase@2.75.0 status -o env > /tmp/tycoonara-local-env
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const values = Object.fromEntries(fs.readFileSync('/tmp/tycoonara-local-env','utf8').split('\n').filter(l=>l.includes('=')).map(l=>{const i=l.indexOf('=');return [l.slice(0,i),l.slice(i+1).replace(/^"|"$/g,'')];}));
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SUPABASE_URL=${values.API_URL}\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${values.ANON_KEY}\n`);
          fs.unlinkSync('/tmp/tycoonara-local-env');
          JS
      - name: Database RLS and ledger tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security.sql
      - name: Concurrent grant test
        run: node tests/concurrency.mjs
      - name: Production build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile and desktop browser acceptance tests
        run: npm run test:e2e
